name: Emulator P7-9b weather egg

# P7-9b：天氣接力彩蛋在 Android Emulator 上的實際操作錄影與檢查（tools/emulator/p7-9b-acceptance.sh）。
# 只在 P7-9b 分支（不含只改文件的 push）和手動觸發時跑。
on:
  push:
    branches: [feature/p7-9b]
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Tools for cropping and video
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg imagemagick >/dev/null

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/emulator/p7-9b-acceptance.sh app/build/outputs/apk/debug/app-debug.apk emulator-out

      - name: Show report
        if: always()
        run: |
          cat emulator-out/report.txt || true
          {
            echo '## P7-9b 模擬器驗收'
            echo
            echo '```'
            grep -E '^(PASS|FAIL|WARN|結果)' emulator-out/report.txt || echo '沒有報告'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 結果推到 screenshots/<分支>-emulator 分支（Actions artifact 的下載網址在某些環境被擋）
      - name: Push results to a branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d emulator-out ] || exit 0
          cd emulator-out
          git init -q
          git checkout -q -b shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -qm "P7-9b emulator ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "shots:screenshots/${GITHUB_REF_NAME}-emulator"
