name: Emulator acceptance

# W7：在 Android Emulator 上實際打開 App 驗收墨丸 V3（截圖、錄影、重畫次數）。
# 比較久（約 17 分鐘），只在墨丸的功能分支（不含只改文件的 push）和手動觸發時跑。
on:
  push:
    branches: [feature/mowan-weather-poses]
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Tools for cropping and GIFs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg imagemagick >/dev/null

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/emulator/w7-acceptance.sh app/build/outputs/apk/debug/app-debug.apk emulator-out

      - name: Show report
        if: always()
        run: cat emulator-out/report.txt || true

      # 報告裡有 FAIL 就讓這次執行失敗（結果還是會上傳、推到分支）
      - name: Check report
        run: "! grep -q '^FAIL' emulator-out/report.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-acceptance
          path: emulator-out
          if-no-files-found: ignore

      # 結果推到 screenshots/<分支>-emulator 分支，用 git 就能拿到
      - name: Push results to a branch
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d emulator-out ] || exit 0
          cd emulator-out
          git init -q
          git checkout -q -b shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -qm "emulator acceptance ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "shots:screenshots/${GITHUB_REF_NAME}-emulator"
