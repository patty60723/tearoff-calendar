name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # 模擬器驗收腳本裡「小工具真的靜止」的判斷規則（不需要模擬器）
      - name: Emulator script self-test
        run: bash tools/emulator/test-quiet.sh

      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug

      # W7 驗收：墨丸的動畫影格轉成 GIF（影格本身不上傳）
      - name: Animation frames to GIF
        if: always()
        run: |
          d=app/build/screenshots/w7/frames
          [ -d "$d" ] || exit 0
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          for f in "$d"/*/; do
            n=$(basename "$f")
            ffmpeg -loglevel error -y -framerate 15 -i "$f%04d.png" -vf "split[a][b];[a]palettegen=max_colors=64[p];[b][p]paletteuse=dither=none" -loop 0 "app/build/screenshots/w7/$n.gif"
          done
          rm -rf "$d"

      # 測試畫出來的小工具與 App 畫面，失敗時也上傳，方便看哪裡壞了
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots
          if-no-files-found: ignore

      # 同一份截圖也推到 screenshots/<分支> 分支，用 git 就能拿到
      - name: Push screenshots to a branch
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d app/build/screenshots ] || exit 0
          cd app/build/screenshots
          git init -q
          git checkout -q -b shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -qm "screenshots ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "shots:screenshots/${GITHUB_REF_NAME}"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk tearoff-calendar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tearoff-calendar
          path: tearoff-calendar.apk

      # main 分支每次更新，都把最新的 APK 放到 Releases 的「最新版」，手機直接下載
      - name: Publish latest release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest tearoff-calendar.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "最新版（第 $GITHUB_RUN_NUMBER 版）" \
            --notes "用手機下載 tearoff-calendar.apk 直接安裝。新版可以直接蓋過舊版，桌面上的小工具會保留。"
